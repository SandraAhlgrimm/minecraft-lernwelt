/* ---------- Bildschirm skalieren (Tablet, Querformat, HiDPI/scharf) ---------- */
function resize(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  // interne Auflösung = Anzeigegröße × Geräte-Pixeldichte -> gestochen scharf
  cv.width  = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  const sc = cv.width / W;
  ctx.setTransform(sc, 0, 0, sc, 0, 0);   // Zeichnen weiterhin in 800×480-Logik
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize); resize();

/* ---------- Ton (kleine Beep-Töne, ohne Dateien) ---------- */
let AC;
function beep(freq, dur, type){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.15, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sndOk   = ()=>{ beep(660,0.09); setTimeout(()=>beep(880,0.12),90); };
const sndFail = ()=>{ beep(180,0.25,'sawtooth'); };
const sndJump = ()=>{ beep(520,0.08); };
const sndCoin = ()=>{ beep(1050,0.06); setTimeout(()=>beep(1400,0.07),60); };

/* ---------- Sprachausgabe (liest Deutsch vor) ---------- */
function sprich(text){
  try{
    // Auf dem Tablet (APK): native Vorlese-Stimme in der aktuellen Sprache
    if(window.AndroidBridge && typeof AndroidBridge.sprich==='function'){
      try{ AndroidBridge.sprich(text, TTS_CODE[LANG]||'de-DE'); }catch(e){ AndroidBridge.sprich(text); }
      return;
    }
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = TTS_CODE[LANG] || 'de-DE'; u.rate = 0.9; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function appBeenden(){
  try{ if(window.AndroidBridge && typeof AndroidBridge.beenden==='function'){ AndroidBridge.beenden(); return true; } }catch(e){}
  return false;
}

/* ---------- Eingabe (Touch + Maus) ---------- */
let pointer = { x:0, y:0, down:false, justDown:false };
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
  return { x:(t.clientX - r.left) / r.width * W, y:(t.clientY - r.top) / r.height * H };
}
function onDown(e){ e.preventDefault(); const p=toCanvas(e); pointer.x=p.x; pointer.y=p.y; pointer.down=true; pointer.justDown=true; if(AC&&AC.state==='suspended')AC.resume(); }
function onMove(e){ e.preventDefault(); const p=toCanvas(e); pointer.x=p.x; pointer.y=p.y; }
function onUp(e){ e.preventDefault(); pointer.down=false; }
cv.addEventListener('mousedown', onDown); cv.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', onDown, {passive:false}); cv.addEventListener('touchmove', onMove, {passive:false}); cv.addEventListener('touchend', onUp, {passive:false});

/* ---------- Buttons / Helfer zum Zeichnen ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(t,x,y,size,col,align){ ctx.fillStyle=col||'#fff'; ctx.font='bold '+size+'px Trebuchet MS'; ctx.textAlign=align||'center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y); }
let buttons = [];
function knopf(id,x,y,w,h,label,col,txtcol,size){
  const hover = pointer.x>x && pointer.x<x+w && pointer.y>y && pointer.y<y+h;
  ctx.fillStyle='rgba(0,0,0,0.35)'; rr(x+4,y+5,w,h,10); ctx.fill();
  ctx.fillStyle = col || (hover ? '#7bc86c':'#5aa54a'); rr(x,y,w,h,10); ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,0.35)'; rr(x+3,y+3,w-6,h-6,8); ctx.stroke();
  text(label, x+w/2, y+h/2, size||26, txtcol||'#fff');
  buttons.push({id,x,y,w,h});
  return hover;
}
function klick(id){
  if(!pointer.justDown) return false;
  for(const b of buttons){ if(b.id===id && pointer.x>b.x && pointer.x<b.x+b.w && pointer.y>b.y && pointer.y<b.y+b.h) return true; }
  return false;
}

/* ---------- Minecraft-Blöcke zeichnen ---------- */
function block(x,y,s,c1,c2){
  x=Math.round(x); y=Math.round(y);
  ctx.fillStyle=c2; ctx.fillRect(x,y,s,s);
  ctx.fillStyle=c1; ctx.fillRect(x,y,s,Math.round(s*0.72));
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let i=0;i<5;i++){ ctx.fillRect(x+((i*17+(x%7))%(s-6)), y+((i*11+(y%5))%(s-6)), 4,4); }
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(x,y,s,3);
  ctx.fillStyle='rgba(0,0,0,0.20)'; ctx.fillRect(x,y+s-3,s,3);
  ctx.strokeStyle='rgba(0,0,0,0.30)'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,s-2,s-2);
}
/* Gras-Block (grün oben, Erde unten, Grashalme) */
function grasBlock(x,y,s){
  x=Math.round(x); y=Math.round(y);
  ctx.fillStyle='#8a6b4a'; ctx.fillRect(x,y,s,s);
  ctx.fillStyle='#6b4f34';
  for(let i=0;i<6;i++){ ctx.fillRect(x+((i*13+(x%7))%(s-5)), y+((i*9+(y%5))%(s-8))+Math.round(s*0.3), 4,4); }
  ctx.fillStyle='#4f8f36'; ctx.fillRect(x, y, s, Math.round(s*0.34));
  ctx.fillStyle='#63bf44'; ctx.fillRect(x, y, s, 5);
  ctx.fillStyle='#4f8f36';
  for(let gx=0; gx<s; gx+=6){ ctx.fillRect(x+gx, y+Math.round(s*0.34), 4, (gx/6%2===0)?6:3); }
  ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,s-2,s-2);
}
/* Erd-Block */
function erdBlock(x,y,s){
  x=Math.round(x); y=Math.round(y);
  ctx.fillStyle='#8a6b4a'; ctx.fillRect(x,y,s,s);
  ctx.fillStyle='#71543a';
  for(let i=0;i<7;i++){ ctx.fillRect(x+((i*17+(x%9))%(s-5)), y+((i*13+(y%6))%(s-5)), 4,4); }
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(x,y,s,3);
  ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,s-2,s-2);
}
/* Ferne Block-Berge (Parallax) */
function berge(off){
  const base=272;
  for(let i=0;i<7;i++){
    const bx=Math.round(((i*210 - off*0.25)%(W+420)+(W+420))%(W+420))-210;
    const h=70+((i*53)%3)*30;
    ctx.fillStyle='#6a86b0'; ctx.fillRect(bx, base-h, 130, h);
    ctx.fillStyle='#7d98c0'; ctx.fillRect(bx, base-h, 130, 10);
    ctx.fillStyle='#e8f0ff'; ctx.fillRect(bx+34, base-h, 62, 7);
  }
}
/* Stein-Block */
function steinBlock(x,y,s){
  x=Math.round(x); y=Math.round(y);
  ctx.fillStyle='#8a9096'; ctx.fillRect(x,y,s,s);
  ctx.fillStyle='#767c82';
  for(let i=0;i<6;i++){ ctx.fillRect(x+((i*17+(x%7))%(s-6)), y+((i*11+(y%5))%(s-6)), 5,5); }
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(x,y,s,3);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(x,y+s-3,s,3);
  ctx.strokeStyle='rgba(0,0,0,0.30)'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,s-2,s-2);
}
/* Lavafeld (animiert, tödlich) */
function lavaCell(x,y,s){
  x=Math.round(x); y=Math.round(y); const t=anim*0.15;
  ctx.fillStyle='#d8481a'; ctx.fillRect(x,y,s,s);
  ctx.fillStyle='#ff8a2a';
  for(let i=0;i<4;i++){ ctx.fillRect(x+5+i*9, y+8+Math.round(Math.sin(t+i)*4), 6,6); }
  ctx.fillStyle='#ffd23a'; ctx.fillRect(x, y+2+Math.round(Math.sin(t)*2), s, 4);
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,s-2,s-2);
}
/* Sprungfeder (Megasprung) */
function federDraw(x,y,s){
  x=Math.round(x); y=Math.round(y);
  ctx.fillStyle='#4a4f57'; ctx.fillRect(x+4, y+s-10, s-8, 10);
  ctx.strokeStyle='#c9ccd2'; ctx.lineWidth=4; ctx.beginPath();
  let yy=y+s-12; ctx.moveTo(x+10,yy);
  for(let k=0;k<3;k++){ ctx.lineTo(x+s-10, yy-6); ctx.lineTo(x+10, yy-12); yy-=12; }
  ctx.stroke();
  ctx.fillStyle='#ff5b8a'; ctx.fillRect(x+3, y+2, s-6, 8);
  ctx.fillStyle='#ff9bbf'; ctx.fillRect(x+3, y+2, s-6, 3);
}
/* Steve-artige Figur (blockig) */
function heldZeichnen(x,y,s,blick){
  x=Math.round(x); y=Math.round(y); const p=s/8;
  // Beine (blaue Hose) + Schuhe
  ctx.fillStyle='#3a4a8a'; ctx.fillRect(x+p*1.4, y+p*7.6, p*2.4, p*2.4);
  ctx.fillStyle='#2f3d72'; ctx.fillRect(x+p*4.2, y+p*7.6, p*2.4, p*2.4);
  ctx.fillStyle='#5a5a5a'; ctx.fillRect(x+p*1.4, y+p*9.4, p*2.4, p*0.9); ctx.fillRect(x+p*4.2, y+p*9.4, p*2.4, p*0.9);
  // Arme + Hände
  ctx.fillStyle='#28b0a8'; ctx.fillRect(x+p*0.2, y+p*4.2, p*1.3, p*3.2); ctx.fillRect(x+p*6.5, y+p*4.2, p*1.3, p*3.2);
  ctx.fillStyle='#caa06f'; ctx.fillRect(x+p*0.2, y+p*7.0, p*1.3, p*0.9); ctx.fillRect(x+p*6.5, y+p*7.0, p*1.3, p*0.9);
  // Körper (türkises Shirt)
  ctx.fillStyle='#2fb0a8'; ctx.fillRect(x+p*1.4, y+p*4.2, p*5.2, p*3.6);
  ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(x+p*3.9, y+p*4.2, p*0.3, p*3.6);
  // Kopf + Haare
  ctx.fillStyle='#caa06f'; ctx.fillRect(x+p*1.8, y+p*0.2, p*4.4, p*4);
  ctx.fillStyle='#4a3320'; ctx.fillRect(x+p*1.8, y+p*0.2, p*4.4, p*1.3); ctx.fillRect(x+p*1.8, y+p*0.2, p*0.8, p*3);
  // Augen
  const eo = blick<0? -p*0.3 : p*0.3;
  ctx.fillStyle='#fff'; ctx.fillRect(x+p*2.7+eo, y+p*2, p*1, p*1);
  ctx.fillStyle='#3a5fbf'; ctx.fillRect(x+p*2.9+eo, y+p*2.2, p*0.6, p*0.7);
  ctx.fillStyle='#fff'; ctx.fillRect(x+p*4.3+eo, y+p*2, p*1, p*1);
  ctx.fillStyle='#3a5fbf'; ctx.fillRect(x+p*4.5+eo, y+p*2.2, p*0.6, p*0.7);
  ctx.fillStyle='#a87a52'; ctx.fillRect(x+p*3.6, y+p*3.2, p*1.2, p*0.5);
}
/* Ender-Drache (blockig, dunkelviolett, magenta Augen) */
function drache(x,y,s,flap){
  x=Math.round(x); y=Math.round(y); const p=s/12;
  const wy = flap ? y-p : y+p*1.5;
  ctx.fillStyle='#241a33'; ctx.fillRect(x, wy, p*5, p*4); ctx.fillRect(x+p*0.5, wy-p*1.5, p*3.5, p*2);
  ctx.fillStyle='#3a2a55'; ctx.fillRect(x+p*1, wy+p*0.5, p*3, p*2.5);
  ctx.fillStyle='#1c1428'; ctx.fillRect(x+p*3, y+p*4.5, p*4, p*1.4); // Schwanz
  ctx.fillStyle='#2b2140'; ctx.fillRect(x+p*4, y+p*3, p*5, p*4); // Körper
  ctx.fillStyle='#3a2a55'; ctx.fillRect(x+p*4, y+p*3, p*5, p*1.2);
  ctx.fillStyle='#241a33'; ctx.fillRect(x+p*8, y+p*1.5, p*4, p*3.2); // Kopf
  ctx.fillStyle='#2b2140'; ctx.fillRect(x+p*11.5, y+p*2.6, p*1.6, p*1.4); // Schnauze
  ctx.fillStyle='#d84bd8'; ctx.fillRect(x+p*9.2, y+p*2.4, p*1.2, p*0.9); // Auge
  ctx.fillStyle='#ff9bff'; ctx.fillRect(x+p*9.4, y+p*2.55, p*0.5, p*0.5);
  ctx.fillStyle='#1c1428'; ctx.fillRect(x+p*4.5, y+p*6.6, p*1.6, p*1.4); ctx.fillRect(x+p*7, y+p*6.6, p*1.6, p*1.4); // Beine
  ctx.fillStyle='rgba(180,90,220,0.5)'; ctx.fillRect(x+p*13, y+p*3.2, 3,3); ctx.fillRect(x+p*13.5, y+p*4.4, 2,2);
}

/* ================================================================
   5) JUMP & RUN  –  Drachensprung, Diamanten sammeln
   ================================================================ */
let jr = {};
function starteJumpRun(level){
  level = level || 1;
  const cfg = LEVELS[Math.min(level, LEVELS.length)-1];
  jr = {
    x:120, y:240, vy:0, onGround:true, jumpsLeft:2,
    worldX:0, speed:cfg.speed, lebt:true, level,
    diamGesammelt:0, leben:3, unverwundbar:0, safeX:0, safeY:240,
    plattformen:[], diamanten:[], gegner:[], lava:[], schuesse:[], cool:0, custom:false, fertig:false,
  };
  // Start-Plattform direkt unter dem Helden (kein Loch am Anfang)
  jr.plattformen.push({x:0, y:300, w:360, mat:'gras'});
  let prevY = 300;
  let px = 360 + 80;
  for(let i=0;i<cfg.count;i++){
    const step = Math.floor(Math.random()*(cfg.step*2+1)) - cfg.step;
    let py = prevY + step*46;
    py = Math.max(170, Math.min(300, py));
    prevY = py;
    const bw = 120 + Math.floor(Math.random()*70);
    let mat='gras';
    if(cfg.feder && Math.random()<0.15) mat='feder';
    else if(cfg.stein && Math.random()<0.3) mat='stein';
    jr.plattformen.push({x:px, y:py, w:bw, mat});
    if(Math.random()<cfg.dia) jr.diamanten.push({x:px+bw/2, y:py-50, weg:false});
    if(i>1 && Math.random()<cfg.enemy) jr.gegner.push({x:px+bw/2, y:py-46, baseY:py-46, t:Math.random()*6});
    const gap = cfg.gap + Math.floor(Math.random()*cfg.gapX);
    if(cfg.lava && Math.random()<0.35) jr.lava.push({x:px+bw+(gap-40)/2, y:360});
    px += bw + gap;
  }
  jr.endX = px + 100;
}
// Held verletzt: Leben abziehen, ggf. an sicherer Stelle wiederbeleben
function heldVerletzt(){
  if(jr.unverwundbar>0 || !jr.lebt) return;
  jr.leben--;
  sndFail();
  if(jr.leben<=0){ jr.leben=0; jr.lebt=false; return; }
  // Wiederbeleben auf der zuletzt sicheren Plattform, kurz unverwundbar
  jr.worldX = jr.safeX;
  jr.y = jr.safeY; jr.vy = 0; jr.onGround=false; jr.jumpsLeft=2;
  jr.unverwundbar = 90;
}
function jumpRun(){
  himmel();
  berge(jr.worldX);
  kopf(t('drachensprung'));
  const groundY = 380;

  // Steuerung: läuft automatisch; Tippen = Sprung, Feuer-Knopf = schießen
  const fb = { x:W-172, y:H-150, w:152, h:60 };
  const imFeuer = pointer.x>fb.x && pointer.y>fb.y && pointer.y<fb.y+fb.h;
  const tippSprung = pointer.justDown && pointer.y > 60 && !(pointer.x<150 && pointer.y>H-60) && !imFeuer;

  // Physik
  if(jr.lebt){
    jr.worldX += jr.speed;
    if(jr.cool>0) jr.cool--;
    // Schießen (Feuerball)
    if(pointer.justDown && imFeuer && jr.cool<=0){
      jr.schuesse.push({x: jr.worldX + jr.x + 46, y: jr.y+24, vx:9});
      jr.cool=9; beep(760,0.05); setTimeout(()=>beep(520,0.06),50);
    }
    // Doppelsprung: max. 2 Sprünge, bevor der Boden berührt wird
    if(tippSprung && jr.jumpsLeft>0){ jr.vy = jr.onGround ? -12.5 : -11.2; jr.jumpsLeft--; jr.onGround=false; sndJump(); }
    jr.vy += 0.5; jr.y += jr.vy;
    if(jr.unverwundbar>0) jr.unverwundbar--;
    jr.onGround=false;
    // Projektile bewegen
    for(const s of jr.schuesse) s.x += s.vx;

    // Boden-Kollision (durchgehender Boden ganz unten als Sicherheit? Nein -> Löcher)
    // Plattform-Kollision
    const px = jr.x; // Bildschirm-X des Helden fest
    for(const p of jr.plattformen){
      const sx = p.x - jr.worldX;
      if(px+30 > sx && px < sx + p.w){
        if(jr.vy>=0 && jr.y+60 >= p.y && jr.y+60 <= p.y + 30){
          if(p.mat==='feder'){ jr.y=p.y-60; jr.vy=-18.5; jr.jumpsLeft=2; jr.onGround=false; beep(900,0.08); setTimeout(()=>beep(1350,0.1),70); }
          else { jr.y = p.y - 60; jr.vy = 0; jr.onGround=true; jr.jumpsLeft=2; jr.safeX = jr.worldX; jr.safeY = p.y - 60; }
        }
      }
    }
    // Runtergefallen?
    if(jr.y > H+60){ heldVerletzt(); }
    // Lava berühren = Leben verlieren
    for(const L of jr.lava){
      const pxw=jr.worldX+jr.x;
      if(pxw+30 > L.x && pxw < L.x+40 && jr.y+58 > L.y+8 && jr.y < L.y+40){ heldVerletzt(); }
    }
    // Diamanten
    for(const d of jr.diamanten){
      if(d.weg) continue;
      const sx=d.x - jr.worldX;
      if(Math.abs((jr.x+15)-sx)<30 && Math.abs((jr.y+30)-d.y)<40){ d.weg=true; jr.diamGesammelt++; sndCoin(); }
    }
    // Feuerbälle treffen Gegner
    for(const s of jr.schuesse){
      for(const g of jr.gegner){
        if(g.dead) continue;
        const gy=g.baseY + Math.sin(g.t)*30;
        if(Math.abs(s.x-g.x)<32 && Math.abs(s.y-gy)<36){ g.dead=true; s.dead=true; jr.diamGesammelt++; sndCoin(); }
      }
    }
    jr.schuesse = jr.schuesse.filter(s=> !s.dead && (s.x - jr.worldX) < W+60);
    // Gegner (Drachen) – berühren = verloren
    for(const g of jr.gegner){
      if(g.dead) continue;
      g.t += 0.05; const gy = g.baseY + Math.sin(g.t)*30;
      const sx=g.x - jr.worldX;
      if(sx>-60 && sx<W+60 && Math.abs((jr.x+15)-sx)<34 && Math.abs((jr.y+30)-gy)<34){
        heldVerletzt();
      }
    }
    // Ziel erreicht
    if(jr.worldX > jr.endX - jr.x){
      if(!jr.custom && jr.level===save.maxLevel && jr.level<LEVELS.length) save.maxLevel++;
      save.sterne += 1; speichern();
      pendingScore = jr.diamGesammelt; pendingLevel = jr.level;
      pendingCustom = jr.custom; pendingWeltIndex = (typeof jr.weltIndex==='number' ? jr.weltIndex : -1);
      jr.lebt=false; jr.fertig=true;
      eingabeName = letzterName;
      sprich(t('winSpeak'));
      scene='nameEingabe';
    }
  }

  // ---- Zeichnen ----
  // Plattformen
  for(const p of jr.plattformen){
    const sx=p.x - jr.worldX;
    if(sx>W || sx+p.w<0) continue;
    if(p.mat==='stein'){
      for(let x=0;x<p.w;x+=40) steinBlock(sx+x, p.y, 40);
      steinBlock(sx, p.y+40, 40); steinBlock(sx+p.w-40, p.y+40, 40);
    } else if(p.mat==='feder'){
      for(let x=0;x<p.w;x+=40) grasBlock(sx+x, p.y, 40);
      federDraw(sx, p.y, 40);
    } else {
      for(let x=0;x<p.w;x+=40) grasBlock(sx+x, p.y, 40);
      erdBlock(sx, p.y+40, 40);
      erdBlock(sx+p.w-40, p.y+40, 40);
    }
  }
  // Lava
  for(const L of jr.lava){ const sx=L.x - jr.worldX; if(sx<-40||sx>W+40) continue; lavaCell(sx, L.y, 40); }
  // Diamanten (Minecraft-Edelstein)
  for(const d of jr.diamanten){ if(d.weg) continue; const sx=d.x - jr.worldX; if(sx<-30||sx>W+30)continue;
    const fy=d.y+Math.sin(anim*0.1)*4;
    ctx.save(); ctx.translate(sx,fy);
    ctx.fillStyle='rgba(126,200,255,0.25)'; ctx.beginPath(); ctx.arc(0,0,20,0,7); ctx.fill();
    ctx.rotate(Math.PI/4);
    ctx.fillStyle='#2f8fd0'; ctx.fillRect(-11,-11,22,22);
    ctx.fillStyle='#7ec8ff'; ctx.fillRect(-9,-9,18,18);
    ctx.fillStyle='#c9ecff'; ctx.fillRect(-9,-9,9,9);
    ctx.fillStyle='#eaf7ff'; ctx.fillRect(-7,-7,4,4);
    ctx.restore(); }
  // Gegner-Drachen
  for(const g of jr.gegner){ if(g.dead) continue; const sx=g.x - jr.worldX; if(sx<-70||sx>W+70)continue; const gy=g.baseY+Math.sin(g.t)*30; drache(sx-40, gy-30, 80, Math.floor(anim/8)%2===0); }
  // Feuerbälle
  for(const s of jr.schuesse){ const sx=s.x - jr.worldX; if(sx<-20||sx>W+20)continue;
    ctx.fillStyle='rgba(255,140,50,0.4)'; ctx.fillRect(sx-16, s.y-3, 12, 6);
    ctx.fillStyle='#ffca3a'; ctx.beginPath(); ctx.arc(sx,s.y,8,0,7); ctx.fill();
    ctx.fillStyle='#ff6b2a'; ctx.beginPath(); ctx.arc(sx,s.y,4.5,0,7); ctx.fill(); }
  // Ziel-Fahne
  const zx = jr.endX - jr.worldX;
  if(zx<W+40){ ctx.fillStyle='#5a4632'; ctx.fillRect(zx, 200, 8, 180); ctx.fillStyle='#e03a5a'; ctx.fillRect(zx+8, 200, 60, 40); text('🏁', zx+38, 220, 30); }

  // Held (blinkt kurz nach einem Treffer)
  if(!(jr.unverwundbar>0 && Math.floor(anim/4)%2===0)) heldZeichnen(jr.x, jr.y, 60, 1);

  // HUD
  text('♦ '+jr.diamGesammelt, 20, 78, 24,'#204060','left');
  // Leben (Herzen)
  for(let i=0;i<3;i++) text(i<jr.leben?'❤️':'🤍', 24+i*30, 112, 22, '#000', 'left');
  if(!jr.custom) text(t('level',{n:jr.level}), W/2, 78, 22, '#204060');
  // Sprung-Anzeige (rechts, über dem Feuer-Knopf)
  ctx.fillStyle='rgba(0,0,0,0.28)'; rr(W-240,H-84,220,26,8); ctx.fill();
  text(t('jumpHint'), W-130, H-71, 14, '#fff');
  for(let i=0;i<2;i++){ ctx.fillStyle = i<jr.jumpsLeft ? '#63bf44' : 'rgba(255,255,255,0.25)'; ctx.fillRect(W-236+i*15, H-52, 11,11); }
  // Feuer-Knopf
  knopf('feuer', W-172, H-150, 152, 60, t('shoot'), jr.cool>0?'#a33a2a':'#e05a3a','#fff',22);

  zurueckKnopf();

  // Tod / Fertig-Overlay
  if(!jr.lebt){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    if(jr.fertig){ text(t('geschafft'), W/2, 150, 44, '#ffe86b'); text(t('gotDiamonds',{n:jr.diamGesammelt}), W/2, 200, 28, '#fff'); }
    else { text(t('ups'), W/2, 160, 40, '#fff'); }
    knopf('nochmal', W/2-170, 250, 160, 64, t('nochmal'), '#5aa54a','#fff',24);
    knopf('menu2',   W/2+10,  250, 160, 64, '🏠 '+t('menu'), '#3a86e0','#fff',24);
    if(pointer.justDown){
      if(klick('nochmal')){ if(darfSpielen()){ zahleSpiel(); if(jr.custom) spieleGebauteWelt(); else starteJumpRun(jr.level); } else { sprich(t('collectAgainSpeak')); scene='menu'; } }
      if(klick('menu2')){ scene = jr.custom ? 'bauen' : 'menu'; }
    }
  }

  if(pointer.justDown && jr.lebt && klick('zurueck')){ scene='menu'; }
}

/* ================================================================
   6) BAU-MODUS  –  eigene Drachenwelt bauen
   ================================================================ */
let builder = { grid:null, C:28, R:7, tool:1, scroll:0 };
const paletteTools = [
  { id:'block',   v:1, icon:'🟩', name:'Block' },
  { id:'stein',   v:5, icon:'🪨', name:'Stein' },
  { id:'lava',    v:6, icon:'🌋', name:'Lava' },
  { id:'feder',   v:7, icon:'🔼', name:'Feder' },
  { id:'diamant', v:2, icon:'💎', name:'Dia' },
  { id:'drache',  v:3, icon:'🐉', name:'Drache' },
  { id:'ziel',    v:4, icon:'🏁', name:'Ziel' },
  { id:'radierer',v:0, icon:'🧽', name:'Löschen' },
];
function starteBauen(){
  let g=null;
  try{ const s=localStorage.getItem('mc_bauwelt'); if(s) g=JSON.parse(s); }catch(e){}
  if(!g || !Array.isArray(g) || g.length!==builder.C){
    g=[]; for(let c=0;c<builder.C;c++) g.push(new Array(builder.R).fill(0));
    // kleine Beispiel-Plattform als Start
    for(let c=0;c<3;c++) g[c][5]=1;
  }
  builder.grid=g; builder.scroll=0; builder.tool=1;
}
const toolKey = { block:'toolBlock', stein:'toolStein', lava:'toolLava', feder:'toolFeder', diamant:'toolDia', drache:'toolDrache', ziel:'toolZiel', radierer:'toolLoeschen' };
function bauen(){
  himmel(); berge(builder.scroll); kopf(t('bauenTitle'));
  const gX=20, gY=104, cols=builder.C, rows=builder.R, cs=40, viewW=760;

  // Werkzeug-Palette
  const pw=90, ph=42, px0=19, py=56, pgap=6;
  paletteTools.forEach((tl,i)=>{
    const bx=px0+i*(pw+pgap);
    knopf('t_'+tl.id, bx, py, pw, ph, tl.icon+' '+t(toolKey[tl.id]), builder.tool===tl.v?'#ffb84d':'#5a6a7a','#fff',15);
    if(builder.tool===tl.v){ ctx.strokeStyle='#fff'; ctx.lineWidth=3; rr(bx,py,pw,ph,10); ctx.stroke(); }
  });

  // Bau-Gitter (mit Clipping + Scroll)
  ctx.save(); rr(gX,gY,viewW,rows*cs,6); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(gX,gY,viewW,rows*cs);
  for(let c=0;c<cols;c++){
    const cx=gX + c*cs - builder.scroll;
    if(cx>gX+viewW || cx+cs<gX) continue;
    for(let r=0;r<rows;r++){
      const cy=gY+r*cs, v=builder.grid[c][r];
      ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1; ctx.strokeRect(cx,cy,cs,cs);
      if(v===1) grasBlock(cx,cy,cs);
      else if(v===5) steinBlock(cx,cy,cs);
      else if(v===6) lavaCell(cx,cy,cs);
      else if(v===7){ grasBlock(cx,cy,cs); federDraw(cx,cy,cs); }
      else if(v===2){ ctx.save(); ctx.translate(cx+20,cy+20); ctx.rotate(Math.PI/4); ctx.fillStyle='#2f8fd0'; ctx.fillRect(-11,-11,22,22); ctx.fillStyle='#7ec8ff'; ctx.fillRect(-9,-9,18,18); ctx.fillStyle='#eaf7ff'; ctx.fillRect(-7,-7,5,5); ctx.restore(); }
      else if(v===3) drache(cx-6,cy+2,44, Math.floor(anim/8)%2===0);
      else if(v===4){ ctx.fillStyle='#5a4632'; ctx.fillRect(cx+7,cy+3,5,cs-6); text('🏁',cx+24,cy+16,22); }
    }
  }
  ctx.restore();
  if(builder.scroll<40){ ctx.fillStyle='rgba(90,165,74,0.9)'; rr(gX,gY,74,24,6); ctx.fill(); text('START',gX+37,gY+12,15,'#fff'); }
  text(t('buildHint'), W/2, 394, 14, '#204060');

  // Aktions-Leiste
  const by=402, bh=62;
  knopf('scrollL',  20, by,  66, bh, '◀', '#3a86e0','#fff',26);
  knopf('scrollR',  90, by,  66, bh, '▶', '#3a86e0','#fff',26);
  knopf('loeschen',160, by, 104, bh, t('leeren'), '#e05a5a','#fff',16);
  knopf('speichern',268,by, 120, bh, t('speichernBtn'), '#5aa54a','#fff',16);
  knopf('welten',  392, by,  96, bh, t('weltenBtn'), '#8a5ad0','#fff',16);
  knopf('spielen', 492, by, 160, bh, t('spielen'), '#c98a2a','#fff',22);
  knopf('bmenu',   656, by, 124, bh, '⬅ '+t('menu'), '#3a86e0','#fff',16);
  flashZeigen();

  // Blöcke setzen (auch beim Ziehen)
  const inGrid = pointer.x>gX && pointer.x<gX+viewW && pointer.y>gY && pointer.y<gY+rows*cs;
  if(pointer.down && inGrid){
    const col=Math.floor((pointer.x - gX + builder.scroll)/cs);
    const row=Math.floor((pointer.y - gY)/cs);
    if(col>=0&&col<cols&&row>=0&&row<rows){
      if(builder.tool===4){ for(let c=0;c<cols;c++)for(let r=0;r<rows;r++) if(builder.grid[c][r]===4) builder.grid[c][r]=0; builder.grid[col][row]=4; }
      else builder.grid[col][row]=builder.tool;
    }
  }
  if(pointer.justDown){
    for(const tl of paletteTools){ if(klick('t_'+tl.id)) builder.tool=tl.v; }
    if(klick('scrollL')) builder.scroll=Math.max(0, builder.scroll-160);
    if(klick('scrollR')) builder.scroll=Math.min(cols*cs-viewW, builder.scroll+160);
    if(klick('loeschen')){ for(let c=0;c<cols;c++) builder.grid[c].fill(0); }
    if(klick('speichern')){ try{ localStorage.setItem('mc_bauwelt', JSON.stringify(builder.grid)); }catch(e){} weltNameEingabe=''; scene='weltName'; }
    if(klick('welten')){ weltenScroll=0; scene='meineWelten'; }
    if(klick('spielen')){ if(darfSpielen()){ zahleSpiel(); spieleGebauteWelt(-1); } else { zeigeFlash(false,t('needCollect',{n:KOSTEN})); } }
    if(klick('bmenu')){ scene='menu'; }
  }
}
function spieleGebauteWelt(weltIndex){
  starteJumpRun();
  jr.custom=true;
  jr.weltIndex = (typeof weltIndex==='number' ? weltIndex : -1);
  jr.plattformen=[{x:0,y:300,w:240,mat:'gras'}];  // sichere Start-Plattform
  jr.diamanten=[]; jr.gegner=[]; jr.lava=[]; jr.schuesse=[];
  const base=300; let maxX=base, goalX=null;
  const C=builder.C, R=builder.R, g=builder.grid;
  for(let c=0;c<C;c++) for(let r=0;r<R;r++){
    const v=g[c][r]; if(!v) continue;
    const x=base + c*40, y=104 + r*40;
    if(v===1){ jr.plattformen.push({x,y,w:40,mat:'gras'}); }
    else if(v===5){ jr.plattformen.push({x,y,w:40,mat:'stein'}); }
    else if(v===7){ jr.plattformen.push({x,y,w:40,mat:'feder'}); }
    else if(v===6){ jr.lava.push({x,y}); }
    else if(v===2){ jr.diamanten.push({x:x+20,y:y+20,weg:false}); }
    else if(v===3){ jr.gegner.push({x:x+20,y:y+20,baseY:y+20,t:Math.random()*6}); }
    else if(v===4){ goalX=x; }
    maxX=Math.max(maxX, x+40);
  }
  jr.endX = (goalX!==null ? goalX+40 : maxX+120);
  scene='jumprun';
}
// Gespeicherte, benannte Welt spielen
function spieleWelt(index){
  const w=welten[index]; if(!w) return;
  builder.grid = w.grid.map(col=>col.slice());
  spieleGebauteWelt(index);
}

    if(e===letzterEintrag){
      ctx.fillStyle='rgba(255,205,60,0.55)'; rr(96,y-16,608,30,8); ctx.fill();
      ctx.strokeStyle='#f0a800'; ctx.lineWidth=2.5; rr(96,y-16,608,30,8); ctx.stroke();
      text('▶', 690, y, 18, '#e08a00','left');
    }
    text(i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.', 110, y, 20, '#111','left');
    text(e.name, 205, y, 20, e===letzterEintrag?'#7a4a00':'#111','left');
    text(e.punkte+' ♦', 430, y, 20, '#8a3ae0','left');
    text(e.level? e.level : '1', 555, y, 20, '#5aa54a','left');
    text(e.datum, 620, y, 18, '#555','left');
  });
  knopf('blmenu', W/2-90, 424, 180, 46, '⬅ '+t('menu'), '#3a86e0','#fff',22);
  if(pointer.justDown && klick('blmenu')) scene='menu';
}
function levelwahl(){
  himmel(); boden(H-80); kopf(t('drachensprung'));
  text(t('chooseLevel'), W/2, 92, 26, '#204060');
  const n=LEVELS.length, bw=126, bh=118, gap=14, tot=n*bw+(n-1)*gap, sx=(W-tot)/2, y=140;
  for(let i=1;i<=n;i++){
    const x=sx+(i-1)*(bw+gap);
    const frei = i<=save.maxLevel;
    knopf('lvl'+i, x, y, bw, bh, '', frei?'#5aa54a':'#7a5a3a','#fff', 20);
    if(frei){ text('▶', x+bw/2, y+38, 42, '#fff'); }
    else { text('🔒', x+bw/2, y+40, 40, '#fff'); }
    text(t('level',{n:i}), x+bw/2, y+bh-24, 18, '#fff');
  }
  text(t('costLine',{n:KOSTEN}), W/2, 300, 18, '#7a3a1a');
  knopf('lwback', W/2-90, 400, 180, 50, '⬅ '+t('menu'), '#3a86e0','#fff',22);
  flashZeigen();
  if(pointer.justDown){
    for(let i=1;i<=n;i++){ if(klick('lvl'+i)){
      if(i>save.maxLevel){ zeigeFlash(false, t('locked')); return; }
      if(darfSpielen()){ zahleSpiel(); starteJumpRun(i); scene='jumprun'; }
      else { zeigeFlash(false, t('firstCollect',{n:KOSTEN})); }
      return;
    }}
    if(klick('lwback')){ scene='menu'; }
  }
}

/* ---------- Welt benennen & speichern ---------- */
function weltName(){
  himmel();
  text(t('weltNameFrage'), W/2, 52, 26, '#123');
  ctx.fillStyle='#fff'; rr(W/2-200,88,400,50,10); ctx.fill();
  ctx.strokeStyle='#8a5ad0'; ctx.lineWidth=3; rr(W/2-200,88,400,50,10); ctx.stroke();
  text(weltNameEingabe+((anim%40<20)?'|':''), W/2, 113, 28, '#111');
  const kw=70, kh=42, ky=158;
  tastenReihen.forEach((row,ri)=>{
    const sx=(W - row.length*(kw+4))/2;
    for(let ci=0;ci<row.length;ci++){
      knopf('wk_'+ri+'_'+ci, sx+ci*(kw+4), ky+ri*(kh+6), kw, kh, row[ci], '#5a6a7a','#fff',22);
    }
  });
  const by=ky+3*(kh+6)+8;
  knopf('wspace', W/2-250, by, 150, 48, t('leer'), '#5a6a7a','#fff',20);
  knopf('wdel',   W/2-90,  by, 130, 48, t('weg'), '#e05a5a','#fff',20);
  knopf('wok',    W/2+52,  by, 200, 48, t('fertig'), '#5aa54a','#fff',22);
  knopf('wabbruch', 12, H-52, 150, 40, '⬅ '+t('bauenTitle'), '#3a86e0','#fff',18);
  flashZeigen();
  if(pointer.justDown){
    tastenReihen.forEach((row,ri)=>{ for(let ci=0;ci<row.length;ci++){ if(klick('wk_'+ri+'_'+ci) && weltNameEingabe.length<12){ weltNameEingabe+=row[ci]; beep(600,0.04); } } });
    if(klick('wspace') && weltNameEingabe.length<12 && weltNameEingabe.length>0) weltNameEingabe+=' ';
    if(klick('wdel')) weltNameEingabe=weltNameEingabe.slice(0,-1);
    if(klick('wabbruch')){ scene='bauen'; return; }
    if(klick('wok')){
      const nm=weltNameEingabe.trim()||('Welt '+(welten.length+1));
      const grid=builder.grid.map(col=>col.slice());
      const vorhanden=welten.findIndex(w=>w.name.toLowerCase()===nm.toLowerCase());
      if(vorhanden>=0){ welten[vorhanden]={name:nm, grid, datum:heuteStr()}; }
      else { welten.push({name:nm, grid, datum:heuteStr()}); }
      speichereWelten(); sndOk();
      zeigeFlash(true, t('weltGespeichertName',{n:nm}));
      scene='bauen';
    }
  }
}

/* ---------- Meine Welten: gespeicherte Welten wiederfinden & spielen ---------- */
function meineWelten(){
  himmel();
  text(t('meineWelten'), W/2, 44, 34, '#123');
  ctx.fillStyle='rgba(255,255,255,0.92)'; rr(60,72,680,318,12); ctx.fill();
  if(welten.length===0){ text(t('keineWelten'), W/2, 220, 20, '#666'); }
  const proSeite=5, start=weltenScroll;
  for(let i=0;i<proSeite;i++){
    const idx=start+i; if(idx>=welten.length) break;
    const w=welten[idx]; const y=90+i*58;
    ctx.fillStyle='rgba(90,90,120,0.08)'; rr(74,y,652,50,8); ctx.fill();
    text((idx+1)+'. '+w.name, 90, y+25, 22, '#123','left');
    text(w.datum, 470, y+25, 16, '#666','left');
    knopf('wspiel'+idx, 556, y+6, 100, 38, t('spielen'), '#5aa54a','#fff',17);
    knopf('wdelete'+idx, 664, y+6, 52, 38, '🗑️', '#e05a5a','#fff',18);
  }
  if(welten.length>proSeite){
    knopf('wup', 60, 400, 110, 46, '▲', '#3a86e0','#fff',24);
    knopf('wdown', 178, 400, 110, 46, '▼', '#3a86e0','#fff',24);
  }
  knopf('wlback', W-210, 400, 150, 46, '⬅ '+t('menu'), '#3a86e0','#fff',20);
  flashZeigen();
  if(pointer.justDown){
    for(let i=0;i<proSeite;i++){
      const idx=start+i; if(idx>=welten.length) break;
      if(klick('wspiel'+idx)){ if(darfSpielen()){ zahleSpiel(); spieleWelt(idx); } else { zeigeFlash(false,t('needCollect',{n:KOSTEN})); } return; }
      if(klick('wdelete'+idx)){ welten.splice(idx,1); speichereWelten(); if(weltenScroll>=welten.length) weltenScroll=Math.max(0,weltenScroll-proSeite); sndFail(); return; }
    }
    if(welten.length>proSeite){
      if(klick('wup')) weltenScroll=Math.max(0, weltenScroll-proSeite);
      if(klick('wdown')) weltenScroll=Math.min(Math.max(0,welten.length-proSeite), weltenScroll+proSeite);
    }
    if(klick('wlback')) scene='menu';
  }
}

/* ---------- gemeinsame UI-Teile ---------- */
function zurueckKnopf(){ knopf('zurueck', 12, H-52, 130, 40, '⬅ '+t('menu'), '#3a86e0', '#fff', 20); }
function flashZeigen(){
  if(flash.t>0 && flash.t<900){
    flash.t--;
    ctx.fillStyle = flash.ok ? 'rgba(90,165,74,0.92)':'rgba(224,58,90,0.92)';
    rr(W/2-160, H-70, 320, 46, 10); ctx.fill();
    text(flash.msg, W/2, H-47, 24, '#fff');
  }
}

/* ---------- Spielstart-Router ---------- */
function starte(id){
  flash.t=0;
  if(id==='lesen') starteLesen();
  else if(id==='schreiben') starteSchreiben();
  else if(id==='rechnen') starteRechnen();
  else if(id==='jumprun') starteJumpRun();
}

/* ================================================================
   HAUPT-SCHLEIFE
   ================================================================ */
function loop(){
  anim++;
  buttons.length=0;
  ctx.clearRect(0,0,W,H);
  if(scene!=='sperre' && scene!=='nameEingabe' && Date.now()-startZeit>SPIELZEIT_MS){ scene='sperre'; pinEingabe=''; sprich(t('timeUpSpeak')); }
  if(scene==='menu') menu();
  else if(scene==='lesen') lesen();
  else if(scene==='schreiben') schreiben();
  else if(scene==='rechnen') rechnen();
  else if(scene==='levelwahl') levelwahl();
  else if(scene==='jumprun') jumpRun();
  else if(scene==='bauen') bauen();
  else if(scene==='weltName') weltName();
  else if(scene==='meineWelten') meineWelten();
  else if(scene==='sperre') sperre();
  else if(scene==='nameEingabe') nameEingabe();
  else if(scene==='bestenliste') bestenliste();
  pointer.justDown=false;
  requestAnimationFrame(loop);
}
loop();
</script>
